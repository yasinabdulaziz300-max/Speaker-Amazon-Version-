name: Build Speaker Core Purger

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK; just accept its licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Find the project folder (the one that contains gradlew). If the project was uploaded
      # as a .zip file, unzip it first.
      - name: Find project folder
        run: |
          G=$(find . -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -z "$G" ]; then
            Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              mkdir -p "$RUNNER_TEMP/proj"
              unzip -q -o "$Z" -d "$RUNNER_TEMP/proj"
              G=$(find "$RUNNER_TEMP/proj" -name gradlew | head -n 1)
            fi
          fi
          if [ -z "$G" ]; then
            echo "::error::No project found. Upload the project .zip (or all project files) to the repo."
            exit 1
          fi
          DIR=$(cd "$(dirname "$G")" && pwd)
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$DIR/gradlew"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      # Optional: decode a release keystore from the KEYSTORE_BASE64 secret.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug and release APKs
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerCorePurger-apks
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*/release/*.apk
          if-no-files-fou
          nd: error
